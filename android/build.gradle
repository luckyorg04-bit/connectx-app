allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Normalize legacy Flutter Android plugins for AGP 8 and Java 17.
subprojects {
    plugins.withId("com.android.library") {
        def androidExtension = project.extensions.findByName("android")

        if (androidExtension != null) {
            // Legacy plugins may omit compileSdk or inherit an obsolete SDK.
            androidExtension.compileSdkVersion = 36
            androidExtension.buildFeatures.buildConfig = true

            if (androidExtension.namespace == null || androidExtension.namespace.toString().trim().isEmpty()) {
                def manifestFile = project.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifest = new XmlSlurper(false, false).parse(manifestFile)
                    def manifestPackage = manifest.@package.text()?.trim()
                    if (manifestPackage) {
                        androidExtension.namespace = manifestPackage
                        project.logger.lifecycle("ConnectX: using manifest package '${manifestPackage}' as namespace for ${project.name}")
                    }
                }
            }

            androidExtension.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            if (androidExtension.namespace == null || androidExtension.namespace.toString().trim().isEmpty()) {
                throw new GradleException(
                    "ConnectX compatibility check: Android library plugin '${project.name}' has no namespace and no package in src/main/AndroidManifest.xml. Upgrade that Flutter plugin to an AGP 8-compatible version."
                )
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = "17"
        targetCompatibility = "17"
    }

    plugins.withId("org.jetbrains.kotlin.android") {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.jvmTarget = "17"
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
