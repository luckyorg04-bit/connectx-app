allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Enable BuildConfig for Android library plugins (including cloud_firestore).
subprojects {
    plugins.withId("com.android.library") {
        if (project.name == "cloud_firestore") {
            android {
                namespace "io.flutter.plugins.firebase.firestore"
            }
        }
        if (project.name == "flutter_local_notifications") {
            android {
                namespace "com.dexterous.flutterlocalnotifications"
            }
        }
        android {
            buildFeatures {
                buildConfig = true
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
