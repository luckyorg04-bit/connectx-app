name: ConnectX Android APK

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.7.12"
          channel: stable
          cache: true
      - name: Verify Firebase app configuration
        run: |
          node -e "const c=require('./android/app/google-services.json'); if(c.project_info.project_id!=='connectx-app-f8407') throw Error('Wrong Firebase project'); if(!c.client.some(x=>x.client_info.android_client_info.package_name==='com.connectx.app')) throw Error('Missing com.connectx.app Firebase client');"
      - name: Install dependencies
        run: flutter pub get
      - name: Build debug APK for device testing
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: connectx-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
