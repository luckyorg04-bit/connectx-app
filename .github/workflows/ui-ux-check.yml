name: ConnectX UI UX checks

on:
  push:
    branches:
      - release/connectx-ui-ux-polish-1.0.4
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ui-ux-check.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib/main.dart lib/chat_screen.dart lib/group_chat_screen.dart lib/profile_screen.dart lib/new_chat_screen.dart
      - name: Analyze changed UI screens
        run: flutter analyze lib/main.dart lib/chat_screen.dart lib/group_chat_screen.dart lib/profile_screen.dart lib/new_chat_screen.dart --no-fatal-infos
      - name: Run automated tests
        run: flutter test
