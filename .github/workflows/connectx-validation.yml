name: ConnectX validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "fix/**"]

jobs:
  flutter-and-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (Dart 2 compatible)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.7.12"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee analyze.log
          analyze_status=${PIPESTATUS[0]}
          set -e
          if grep -Eq ' (error|warning) • ' analyze.log; then
            exit 1
          fi
          if grep -q 'issues found' analyze.log; then
            echo "Analyzer reported informational lints only; no errors or warnings."
            exit 0
          fi
          exit "$analyze_status"

      - name: Run Flutter tests when present
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --no-pub
          else
            echo "No Dart test files found; Flutter test step skipped."
          fi

      - name: Check VPS API JavaScript syntax
        run: node --check vps-api/server.js
