name: Flutter checks

concurrency:
  group: connectx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.7.12"
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Check VPS API syntax
        run: node --check vps-api/server.js
      - name: Check legacy Cloud Function syntax
        run: node --check functions/index.js
      - name: Check RTDB migration syntax
        run: node --check vps-api/migrate-rtdb.js
      - name: Validate Firebase configuration JSON
        run: node -e "for (const f of ['firebase.json','database.rules.json','firestore.indexes.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
      - name: Validate Realtime Database rules with emulator
        run: npx --yes firebase-tools emulators:exec --only database --project demo-connectx "echo Realtime Database rules loaded"
      - name: Check deployment script syntax
        run: bash -n deploy_part2.sh
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
