name: Flutter checks

concurrency:
  group: connectx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.7.12"
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Check VPS API syntax
        run: node --check vps-api/server.js
      - name: Check deployment script syntax
        run: bash -n deploy_part2.sh
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
