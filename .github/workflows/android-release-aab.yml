name: ConnectX Play Store Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release identity and signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP_ID="$(sed -n 's/^[[:space:]]*applicationId[[:space:]]*"([^"]*)".*/\1/p' android/app/build.gradle | head -n1)"
          if [[ -z "$APP_ID" || "$APP_ID" == com.example.* ]]; then
            echo "::error::Set a final unique applicationId in android/app/build.gradle before release."
            exit 1
          fi
          if [[ -z "$KEYSTORE_B64" || -z "$KEY_ALIAS" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing Android upload keystore GitHub Actions secrets."
            exit 1
          fi
          if ! grep -q "\"package_name\":[[:space:]]*\"$APP_ID\"" android/app/google-services.json; then
            echo "::error::google-services.json package_name does not match applicationId. Register the final package in Firebase and replace this file."
            exit 1
          fi
          echo "Release identity and required secrets checks passed."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/connectx-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/connectx-upload-key.jks"

      - name: Resolve packages
        run: flutter pub get

      - name: Build signed Play Store App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/connectx-upload-key.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: connectx-play-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/connectx-upload-key.jks"
