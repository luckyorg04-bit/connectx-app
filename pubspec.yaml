name: connectx
description: ConnectX real-time messaging app.
publish_to: 'none'
version: 1.1.1+8
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  cloud_firestore: 5.6.6
  cloud_functions: 5.4.0
  firebase_core: 3.13.0
  firebase_auth: 5.5.2
  firebase_database: 11.3.5
  firebase_messaging: 15.2.5
  google_sign_in: ^6.1.5
  http: ^0.13.5
  intl: ^0.20.2
  flutter_local_notifications: ^17.2.4
  elegant_notification: ^1.8.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  image_picker: ^0.8.7+5
  file_picker: 8.3.7
  record: ^4.4.4
  audioplayers: ^5.2.1
  path_provider: ^2.0.14
  geolocator: ^14.0.2
  flutter_webrtc: ^1.6.3
  flutter_ringtone_player: ^4.0.0+4
  video_player: ^2.6.1
  crypto: ^3.0.6
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  collection: 1.17.1
  # file_picker 5.x resolves an obsolete win32 release that is incompatible with Dart 3.5+.
  win32: ^5.5.4
