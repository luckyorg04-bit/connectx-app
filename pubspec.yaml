name: connectx
description: ConnectX real-time messaging app.
publish_to: 'none'
version: 1.1.1+8
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  cloud_firestore: ^4.17.5
  cloud_functions: ^4.7.6
  firebase_core: 2.32.0
  firebase_auth: ^4.20.0
  firebase_database: 10.5.7
  firebase_messaging: 14.9.4
  google_sign_in: ^6.1.5
  http: ^0.13.5
  intl: ^0.20.2
  flutter_local_notifications: ^17.2.4
  elegant_notification: ^1.8.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  image_picker: ^0.8.7+5
  file_picker: 8.0.7
  record: ^4.4.4
  audioplayers: ^5.2.1
  path_provider: ^2.0.14
  geolocator: 13.0.0
  flutter_webrtc: 0.11.6+hotfix.1
  flutter_ringtone_player: ^4.0.0+4
  video_player: ^2.6.1
  crypto: ^3.0.6
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  share_plus: 9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  collection: 1.17.1
  # file_picker 5.x resolves an obsolete win32 release that is incompatible with Dart 3.5+.
  win32: ^5.5.4
