name: connectx
description: ConnectX real-time messaging app.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  cloud_firestore: ^4.17.5
  firebase_core: ^2.10.0
  firebase_auth: ^4.4.2
  firebase_database: ^10.1.1
  firebase_messaging: ^14.4.1
  google_sign_in: ^6.1.5
  http: ^0.13.5
  intl: ^0.17.0
  flutter_local_notifications: ^17.2.4
  elegant_notification: ^1.8.1
  url_launcher: ^6.1.10
  permission_handler: ^10.2.0
  image_picker: ^0.8.7+5
  file_picker: ^8.3.7
  record: ^4.4.4
  audioplayers: ^4.1.0
  path_provider: ^2.0.14
  geolocator: ^9.0.2
  flutter_webrtc: ^0.9.44
  flutter_ringtone_player: ^3.2.0
  video_player: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  collection: 1.17.1
  # file_picker 5.x resolves an obsolete win32 release that is incompatible with Dart 3.5+.
  win32: ^5.5.4
